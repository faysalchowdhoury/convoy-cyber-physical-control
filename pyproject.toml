[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "convoy-cyber-physical-control"
version = "0.1.0"
description = "Physics-Constrained Decentralized Multi-Vehicle Control and In-Vehicle/V2X Cyber-Resilience for Autonomous Ground Convoys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faysal Chowdhoury" }]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "scikit-learn>=1.3",
  "torch>=2.1", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
data = ["py7zr>=0.21", "gdown>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
